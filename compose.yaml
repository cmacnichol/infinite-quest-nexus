name: infinitequest

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: infinitequest
      POSTGRES_USER: infinitequest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - infinitequest-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinitequest -d infinitequest"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - infinitequest-backend

  infinitequest-app:
    build:
      context: .
    image: infinitequest-nexus:local
    environment:
      APP_ROLE: all
      APP_PORT: 8080
      DATABASE_URL: postgresql://infinitequest:${POSTGRES_PASSWORD}@postgres:5432/infinitequest
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-12}
      WORKER_GENERATION_CONCURRENCY: ${WORKER_GENERATION_CONCURRENCY:-1}
      LEGACY_WEB_ROOT: /app/apps/web/dist
      NEXT_WEB_ROOT: /app/apps/web-next/dist
      ASSET_STORAGE_DRIVER: filesystem
      ASSET_STORAGE_ROOT: /var/lib/infinitequest/assets
      ARCHIVE_STORAGE_ROOT: /var/lib/infinitequest/archives
      SYSTEM_ARCHIVE_ENABLED: ${SYSTEM_ARCHIVE_ENABLED:-false}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY_FILE: /var/lib/infinitequest/secrets/credential-encryption-key
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      WORLD_SHARING_ENABLED: ${WORLD_SHARING_ENABLED:-false}
      PROVIDER_NETWORK_ALLOWLIST: ${PROVIDER_NETWORK_ALLOWLIST:-}
      CSP_IMAGE_ALLOWED_ORIGINS: ${CSP_IMAGE_ALLOWED_ORIGINS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - infinitequest-assets:/var/lib/infinitequest/assets
      - infinitequest-secrets:/var/lib/infinitequest/secrets
      - type: volume
        source: infinitequest-archives
        target: /var/lib/infinitequest/archives
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "node /app/scripts/ensure-local-credential-encryption-key.mjs && exec node dist/services/runtime/src/main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 10m
    networks:
      - infinitequest-backend

volumes:
  infinitequest-postgres:
  infinitequest-assets:
  infinitequest-archives:
  infinitequest-secrets:

networks:
  infinitequest-backend:
    name: infinitequest-backend
