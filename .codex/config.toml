sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[mcp_servers.repowise]
command = "repowise"
args = ["mcp"]
startup_timeout_sec = 20

[mcp_servers.repowise.tools.get_answer]
approval_mode = "approve"

[mcp_servers.repowise.tools.get_overview]
approval_mode = "approve"

[features]
hooks = true
