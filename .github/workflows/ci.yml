name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject story exports and sensitive data
        run: pnpm check:data

      - name: Type check
        run: pnpm check

      - name: Test unit suite
        run: pnpm test:unit

      - name: Test PostgreSQL integration suite
        timeout-minutes: 10
        run: pnpm test:integration

      - name: Build application
        run: pnpm build

      - name: Report web bundle budgets
        run: pnpm check:web-bundle-budget

      - name: Validate Compose configuration
        run: POSTGRES_PASSWORD="$(openssl rand -hex 32)" docker compose config --quiet

      - name: Validate Swarm configuration
        run: docker stack config -c deploy/swarm/stack.yaml >/dev/null

      - name: Build container image
        run: docker build --tag infinitequest-nexus:ci .

      - name: Verify container web artifacts
        run: >-
          docker run --rm --entrypoint sh infinitequest-nexus:ci -c
          'test -f /app/apps/web/dist/index.html &&
          test -f /app/apps/web-next/dist/index.html'
